<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Maggot Farming</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <h2>🌿 Login Dashboard</h2>
            <p>Smart Maggot Farming SAI Cibinong</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn-login">Masuk</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
